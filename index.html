<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>EDC Mobi 개인정보처리방침</title>
</head>
<body>
  <p>개인정보처리방침을 불러오는 중입니다.</p>
  <script>
    fetch("https://raw.githubusercontent.com/maas-busan/edc-mobi-privacy-policy/53f503d5bba2173c073dd4f5d455d12f52bd2755/index.html")
      .then(response => {
        if (!response.ok) throw new Error("정책 문서를 불러오지 못했습니다.");
        return response.text();
      })
      .then(html => document.open() || document.write(html.replaceAll("박창순", "스마트시티부산")) || document.close())
      .catch(() => {
        document.body.textContent = "개인정보처리방침을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";
      });
  </script>
</body>
</html>
